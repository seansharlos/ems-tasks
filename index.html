<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>סדר עדיפויות יומי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-firestore-compat.min.js"></script>
<style>
  :root{
    --bg:#0F171E; --panel:#1A252F; --panel-2:#212F3A; --border:#2B3A47; --text:#EAF0F4; --text-dim:#8FA3B0;
    --red:#E14B3C; --red-dim:#3A211E; --amber:#F0A83C; --amber-dim:#3A2F1B;
    --teal:#3FA9A0; --teal-dim:#17302D; --slate:#66798A; --slate-dim:#212B33; --focus:#F0A83C; --green:#3FA96B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  #app{direction:rtl;font-family:'Heebo','Rubik',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:18px 14px 60px;max-width:640px;margin:0 auto;}
  .mono{font-family:'Roboto Mono',ui-monospace,monospace;}
  h1{font-size:20px;font-weight:800;letter-spacing:.2px;margin:0 0 2px;}
  .eyebrow{font-size:11px;color:var(--text-dim);letter-spacing:1.2px;text-transform:uppercase;font-weight:600;}
  .header{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .header-side{flex:1;min-width:0;}
  .header-actions{display:flex;gap:6px;flex:none;}
  .stats-row{display:flex;gap:8px;margin-top:12px;}
  .stat{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center;}
  .stat .n{font-size:18px;font-weight:800;font-family:'Roboto Mono',monospace;}
  .stat .l{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .stat.overdue .n{color:var(--red);}
  .quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 12px;}
  .quad{border-radius:12px;padding:10px 12px;cursor:pointer;border:1px solid transparent;background:var(--panel);transition:transform .12s ease,border-color .12s ease;}
  .quad:active{transform:scale(.98);}
  .quad.active{border-color:var(--focus);}
  .quad .qn{font-size:20px;font-weight:800;font-family:'Roboto Mono',monospace;}
  .quad .ql{font-size:11.5px;margin-top:2px;font-weight:600;}
  .quad.q0{background:var(--red-dim);} .quad.q0 .qn,.quad.q0 .ql{color:var(--red);}
  .quad.q1{background:var(--amber-dim);} .quad.q1 .qn,.quad.q1 .ql{color:var(--amber);}
  .quad.q2{background:var(--teal-dim);} .quad.q2 .qn,.quad.q2 .ql{color:var(--teal);}
  .quad.q3{background:var(--slate-dim);} .quad.q3 .qn,.quad.q3 .ql{color:var(--slate);}
  .toolbar{display:flex;align-items:center;gap:8px;margin:16px 0 10px;}
  .toggle{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;flex:1;}
  .toggle button{flex:1;background:transparent;border:0;color:var(--text-dim);font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 4px;border-radius:8px;cursor:pointer;}
  .toggle button.active{background:var(--panel-2);color:var(--text);}
  .add-btn{background:var(--amber);color:#241a05;border:0;border-radius:10px;font-weight:800;font-size:13px;padding:10px 14px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .icon-round{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-round:hover{color:var(--text);}
  .add-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-dim);margin-top:8px;}
  .sync-pill .d{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .sync-pill.err .d{background:var(--red);}
  .sync-pill.loading .d{background:var(--amber);}
  .group-title{font-size:12.5px;font-weight:800;color:var(--text-dim);margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
  .group-title .dot{width:8px;height:8px;border-radius:50%;}
  .group-title .count{margin-inline-start:auto;font-family:'Roboto Mono',monospace;font-weight:700;}
  .task{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
  .task.done{opacity:.5;}
  .task .check{width:22px;height:22px;border-radius:7px;border:2px solid var(--text-dim);flex:none;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;}
  .task.done .check{background:var(--teal);border-color:var(--teal);}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14.5px;font-weight:600;line-height:1.35;}
  .task.done .task-title{text-decoration:line-through;}
  .task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;font-family:'Roboto Mono',monospace;}
  .badge.cat{background:var(--panel-2);color:var(--text-dim);}
  .badge.q0{background:var(--red-dim);color:var(--red);}
  .badge.q1{background:var(--amber-dim);color:var(--amber);}
  .badge.q2{background:var(--teal-dim);color:var(--teal);}
  .badge.q3{background:var(--slate-dim);color:var(--slate);}
  .badge.overdue{background:var(--red-dim);color:var(--red);}
  .badge.soon{background:var(--amber-dim);color:var(--amber);}
  .task-actions{display:flex;gap:4px;flex:none;}
  .icon-btn{background:transparent;border:0;color:var(--text-dim);cursor:pointer;padding:4px;border-radius:6px;}
  .icon-btn:hover{color:var(--text);background:var(--panel-2);}
  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:36px 10px;border:1px dashed var(--border);border-radius:12px;margin-top:10px;}
  .subtasks{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
  .subtask-row{display:flex;align-items:center;gap:8px;}
  .subcheck{width:18px;height:18px;border-radius:5px;border:2px solid var(--text-dim);background:transparent;flex:none;cursor:pointer;font-size:11px;line-height:1;color:var(--bg);display:flex;align-items:center;justify-content:center;}
  .subcheck.done{background:var(--teal);border-color:var(--teal);}
  .subtitle{flex:1;font-size:13px;}
  .subtitle.done{text-decoration:line-through;color:var(--text-dim);}
  .subtask-add-row{display:flex;gap:6px;margin-top:2px;}
  .subtask-add-row input{flex:1;padding:7px 9px;font-size:12.5px;}
  .error-box{text-align:right;color:var(--red);font-size:12.5px;padding:12px;border:1px solid var(--red-dim);background:var(--red-dim);border-radius:12px;margin:14px 0;line-height:1.6;}
  .sheet-backdrop{position:fixed;inset:0;background:rgba(6,10,13,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px 22px;border:1px solid var(--border);border-bottom:none;max-height:88vh;overflow-y:auto;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 14px;}
  .sheet h2{font-size:16px;margin:0 0 14px;font-weight:800;}
  .sheet p.hint{font-size:12px;color:var(--text-dim);line-height:1.6;margin:0 0 14px;}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);margin:12px 0 6px;letter-spacing:.3px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;}
  textarea{font-family:'Roboto Mono',monospace;font-size:12px;direction:ltr;text-align:left;min-height:130px;resize:vertical;}
  .cat-row{display:flex;gap:8px;}
  .cat-row select{flex:1;}
  .quad-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
  .quad-pick .qp{border-radius:10px;padding:10px;cursor:pointer;border:2px solid transparent;background:var(--panel);}
  .quad-pick .qp.sel{border-color:currentColor;}
  .quad-pick .qp.q0{color:var(--red);} .quad-pick .qp.q1{color:var(--amber);}
  .quad-pick .qp.q2{color:var(--teal);} .quad-pick .qp.q3{color:var(--slate);}
  .quad-pick .qp .t{font-size:12.5px;font-weight:800;}
  .quad-pick .qp .s{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .sheet-actions{display:flex;gap:8px;margin-top:18px;}
  .btn-primary{flex:1;background:var(--amber);color:#241a05;border:0;border-radius:10px;font-weight:800;font-size:14px;padding:12px;cursor:pointer;font-family:inherit;}
  .btn-secondary{background:var(--panel);color:var(--text-dim);border:1px solid var(--border);border-radius:10px;font-size:14px;padding:12px 16px;cursor:pointer;font-family:inherit;}
  .btn-danger{color:var(--red);}
  .footnote{text-align:center;font-size:10.5px;color:var(--text-dim);margin-top:22px;line-height:1.6;}
  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .setup-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:440px;width:100%;}
  .setup-card h1{font-size:18px;margin-bottom:6px;}
  .setup-card p{font-size:13px;color:var(--text-dim);line-height:1.6;}
  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.quad{transition:none;} .spinner{animation:none;}}
  #print-view{display:none;}
  @media print{
    #app.printing > *:not(#print-view){display:none !important;}
    #print-view{display:block !important;position:static;background:#fff;color:#111;padding:0;direction:rtl;font-family:Arial,sans-serif;}
    #print-view h1{font-size:26px;margin:0 0 6px;text-align:center;font-weight:800;}
    #print-view .pdate{font-size:12px;color:#555;margin-bottom:20px;text-align:center;}
    #print-view h2{font-size:15px;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid currentColor;}
    #print-view h2.q0{color:#C0392B;}
    #print-view h2.q1{color:#C77C11;}
    #print-view h2.q2{color:#16796B;}
    #print-view h2.q3{color:#5b6b78;}
    #print-view ul{margin:0;padding-inline-start:4px;list-style:none;}
    #print-view li{margin-bottom:7px;font-size:13px;color:#111;}
    #print-view li.sub{font-size:11px;margin-bottom:5px;margin-inline-start:26px;color:#222;}
    #print-view .box{display:inline-block;width:14px;font-size:14px;}
    #print-view .cat{color:#666;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CFG_KEY = 'ems_task_manager_firebase_config_v1';
const DEFAULT_CATEGORIES = ['כוח אדם','הדרכה ואימונים','ציוד ולוגיסטיקה','בקרת איכות ותלונות','דוחות ותיעוד'];
const QUADS = [
  {id:0,label:'דחוף וחשוב',sub:'לטפל מיד',cls:'q0'},
  {id:1,label:'חשוב, לא דחוף',sub:'לתכנן זמן',cls:'q1'},
  {id:2,label:'דחוף, לא חשוב',sub:'לבצע בקצרה / להאציל',cls:'q2'},
  {id:3,label:'לא דחוף ולא חשוב',sub:'כשיהיה זמן',cls:'q3'},
];

let state = { tasks:[], categories:[...DEFAULT_CATEGORIES], loaded:false, syncStatus:'idle', syncError:null };
let view = { mode:'quadrant', activeQuad:null, sheetOpen:false, editingId:null, form:null, connectScreen:false, connectError:null, screen:'main' };
let db = null;
let expandedTasks = {};

function uid(){ return 'ems' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function getConfig(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); }catch(e){ return null; } }
function setConfig(obj){ localStorage.setItem(CFG_KEY, JSON.stringify(obj)); }

function parseFirebaseConfig(raw){
  let t = (raw||'').trim();
  t = t.replace(/^\s*(export\s+)?(const|let|var)\s+\w+\s*=\s*/,'');
  t = t.replace(/;\s*$/,'');
  try{
    const obj = new Function('return (' + t + ')')();
    if(!obj || typeof obj!=='object' || !obj.apiKey || !obj.projectId) return null;
    return obj;
  }catch(e){ return null; }
}

function ensureFirebase(){
  const cfg = getConfig();
  if(!cfg) return false;
  if(typeof firebase === 'undefined'){
    throw new Error('ספריית Firebase לא נטענה. ודאו שיש חיבור לאינטרנט, שהקובץ נפתח בדפדפן (לא בתצוגה מקדימה), ונסו לרענן.');
  }
  if(!db){
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    db = firebase.firestore();
  }
  return true;
}

async function fetchTasksFromServer(){
  const snap = await db.collection('ems_tasks').orderBy('createdAt','asc').get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function insertTaskServer(row){
  await db.collection('ems_tasks').doc(row.id).set({
    title:row.title, category:row.category, urgent:row.urgent, important:row.important,
    deadline:row.deadline, done:row.done, subtasks:row.subtasks||[], createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
async function patchTaskServer(id, fields){ await db.collection('ems_tasks').doc(id).update(fields); }
async function deleteTaskServer(id){ await db.collection('ems_tasks').doc(id).delete(); }

async function loadData(silent){
  if(!getConfig()){ view.connectScreen = true; state.loaded = true; render(); return; }
  if(!silent) state.syncStatus = 'loading';
  render();
  try{
    ensureFirebase();
    const rows = await fetchTasksFromServer();
    state.tasks = rows.map(r=>({id:r.id,title:r.title,category:r.category,urgent:!!r.urgent,important:!!r.important,deadline:r.deadline||null,done:!!r.done,subtasks:Array.isArray(r.subtasks)?r.subtasks:[]}));
    state.syncStatus='ok'; state.syncError=null;
  }catch(e){
    state.syncStatus='error'; state.syncError = e.message || String(e);
  }
  state.loaded = true;
  render();
}

function quadOf(t){ if(t.urgent && t.important) return 0; if(!t.urgent && t.important) return 1; if(t.urgent && !t.important) return 2; return 3; }
function daysUntil(dateStr){ if(!dateStr) return null; const today=new Date(); today.setHours(0,0,0,0); const d=new Date(dateStr+'T00:00:00'); return Math.round((d-today)/86400000); }
function deadlineBadge(t){
  if(!t.deadline) return '';
  const du=daysUntil(t.deadline);
  const dateFmt=new Date(t.deadline+'T00:00:00').toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
  if(t.done) return `<span class="badge cat mono">יעד ${dateFmt}</span>`;
  if(du<0) return `<span class="badge overdue mono">באיחור ${Math.abs(du)} ימ׳</span>`;
  if(du===0) return `<span class="badge soon mono">היום</span>`;
  if(du===1) return `<span class="badge soon mono">מחר</span>`;
  return `<span class="badge cat mono">יעד ${dateFmt}</span>`;
}
function sortTasks(list){
  return [...list].sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    const qa=quadOf(a), qb=quadOf(b);
    if(qa!==qb) return qa-qb;
    const da=a.deadline?new Date(a.deadline).getTime():Infinity;
    const db_=b.deadline?new Date(b.deadline).getTime():Infinity;
    return da-db_;
  });
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderTaskRow(t){
  const q=quadOf(t);
  const subs = t.subtasks||[];
  const doneCount = subs.filter(s=>s.done).length;
  const expanded = !!expandedTasks[t.id];
  return `
  <div class="task ${t.done?'done':''}">
    <button class="check" onclick="toggleDone('${t.id}')" aria-label="סמן כהושלם">
      ${t.done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#0F171E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
    </button>
    <div class="task-body">
      <div class="task-title">${escapeHtml(t.title)}</div>
      <div class="task-meta">
        <span class="badge cat">${escapeHtml(t.category)}</span>
        <span class="badge ${QUADS[q].cls}">${QUADS[q].label}</span>
        ${deadlineBadge(t)}
        <span class="badge cat" style="cursor:pointer;" onclick="toggleExpand('${t.id}')">${subs.length? (expanded?'▲ ':'▼ ') + 'תתי-משימות ' + doneCount + '/' + subs.length : '+ תת-משימה'}</span>
      </div>
      ${expanded ? renderSubtasks(t) : ''}
    </div>
    <div class="task-actions">
      <button class="icon-btn" onclick="openEdit('${t.id}')" aria-label="עריכה">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" onclick="deleteTask('${t.id}')" aria-label="מחיקה">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>`;
}

function renderSubtasks(t){
  const subs = t.subtasks||[];
  return `<div class="subtasks">
    ${subs.map(s=>`
      <div class="subtask-row">
        <button class="subcheck ${s.done?'done':''}" onclick="toggleSubtask('${t.id}','${s.id}')" aria-label="סמן תת-משימה">${s.done?'✓':''}</button>
        <span class="subtitle ${s.done?'done':''}">${escapeHtml(s.title)}</span>
        <button class="icon-btn" onclick="deleteSubtask('${t.id}','${s.id}')" aria-label="מחיקת תת-משימה">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>`).join('')}
    <div class="subtask-add-row">
      <input type="text" id="new-sub-${t.id}" placeholder="תת-משימה חדשה" onkeydown="if(event.key==='Enter'){submitNewSubtask('${t.id}')}" />
      <button class="btn-secondary" style="padding:6px 10px;font-size:12px;" onclick="submitNewSubtask('${t.id}')">הוספה</button>
    </div>
  </div>`;
}

function renderList(){
  if(state.syncStatus==='error'){
    return `<div class="error-box">בעיה בהתחברות ל-Firebase:<br>${escapeHtml(state.syncError||'')}<br><button class="btn-secondary" style="margin-top:10px;" onclick="loadData(false)">נסה שוב</button></div>`;
  }
  const open=state.tasks.filter(t=>!t.done);
  if(state.tasks.length===0) return `<div class="empty">אין עדיין משימות.<br>לחצו על "הוספת משימה" כדי להתחיל לארגן את סדר היום.</div>`;
  let html=''; let pool=open;
  if(view.activeQuad!==null) pool=pool.filter(t=>quadOf(t)===view.activeQuad);
  if(view.mode==='category'){
    const cats=state.categories.filter(c=>pool.some(t=>t.category===c));
    const extra=[...new Set(pool.map(t=>t.category))].filter(c=>!state.categories.includes(c));
    const orderedCats=[...cats,...extra];
    if(orderedCats.length===0) html+=`<div class="empty">אין משימות פתוחות בסינון הנוכחי.</div>`;
    orderedCats.forEach(cat=>{
      const items=sortTasks(pool.filter(t=>t.category===cat));
      if(items.length===0) return;
      html+=`<div class="group-title"><span>${escapeHtml(cat)}</span><span class="count mono">${items.length}</span></div>`;
      html+=items.map(renderTaskRow).join('');
    });
  } else {
    const order=view.activeQuad!==null?[view.activeQuad]:[0,1,2,3];
    let any=false;
    order.forEach(qid=>{
      const items=sortTasks(pool.filter(t=>quadOf(t)===qid));
      if(items.length===0) return;
      any=true;
      html+=`<div class="group-title"><span class="dot" style="background:var(--${['red','amber','teal','slate'][qid]})"></span><span>${QUADS[qid].label}</span><span class="count mono">${items.length}</span></div>`;
      html+=items.map(renderTaskRow).join('');
    });
    if(!any) html+=`<div class="empty">אין משימות פתוחות בסינון הנוכחי.</div>`;
  }
  return html;
}

function renderDoneScreen(){
  const done = sortTasks(state.tasks.filter(t=>t.done));
  let html = `
    <div class="header">
      <div class="header-side">
        <div class="eyebrow">עוזר ניהול משימות · פיקוד</div>
        <h1>משימות שבוצעו</h1>
      </div>
      <div class="header-actions">
        <button class="icon-round" onclick="showMainScreen()" aria-label="חזרה" title="חזרה">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>`;
  if(done.length===0){
    html += `<div class="empty">עדיין אין משימות שהושלמו.</div>`;
  } else {
    html += `<div class="group-title"><span>סה"כ הושלמו</span><span class="count mono">${done.length}</span></div>`;
    html += done.map(renderTaskRow).join('');
  }
  html += `<div class="footnote">לחיצה על הריבוע ליד משימה תחזיר אותה לרשימת המשימות הפעילות.</div>`;
  return html;
}

function renderStats(){
  const open=state.tasks.filter(t=>!t.done);
  const overdue=open.filter(t=>t.deadline && daysUntil(t.deadline)<0);
  const ui=open.filter(t=>quadOf(t)===0);
  return `<div class="stats-row">
    <div class="stat"><div class="n mono">${open.length}</div><div class="l">משימות פתוחות</div></div>
    <div class="stat overdue"><div class="n mono">${overdue.length}</div><div class="l">באיחור</div></div>
    <div class="stat"><div class="n mono">${ui.length}</div><div class="l">דחוף וחשוב</div></div>
  </div>`;
}
function renderQuadGrid(){
  const open=state.tasks.filter(t=>!t.done);
  return `<div class="quad-grid">${QUADS.map(q=>{
    const count=open.filter(t=>quadOf(t)===q.id).length;
    const active=view.activeQuad===q.id?'active':'';
    return `<div class="quad ${q.cls} ${active}" onclick="setActiveQuad(${q.id})"><div class="qn mono">${count}</div><div class="ql">${q.label}</div></div>`;
  }).join('')}</div>`;
}
function renderSyncPill(){
  const s=state.syncStatus;
  const cls=s==='error'?'err':(s==='loading'?'loading':'');
  const label=s==='error'?'לא מחובר':(s==='loading'?'מסנכרן…':'מסונכרן');
  return `<div class="sync-pill ${cls}"><span class="d"></span><span>${label}</span></div>`;
}

function renderSheet(){
  if(!view.sheetOpen) return '';
  const f=view.form; const isEdit=!!view.editingId;
  return `
  <div class="sheet-backdrop" onclick="closeSheetIfBackdrop(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <h2>${isEdit?'עריכת משימה':'הוספת משימה'}</h2>
      <label>מה צריך לעשות?</label>
      <input type="text" id="f-title" value="${escapeHtml(f.title)}" placeholder="לדוגמה: לתאם הדרכת החייאה לצוות צפון" />
      <label>קטגוריה</label>
      <div class="cat-row">
        <select id="f-cat-select" onchange="onCatSelectChange(this.value)">
          ${state.categories.map(c=>`<option value="${escapeHtml(c)}" ${f.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
          <option value="__new__" ${f.category==='__new__'?'selected':''}>+ קטגוריה חדשה…</option>
        </select>
      </div>
      ${f.category==='__new__'?`<input type="text" id="f-cat-new" placeholder="שם הקטגוריה החדשה" style="margin-top:8px;" value="${escapeHtml(f.newCategory||'')}" />`:''}
      <label>עדיפות</label>
      <div class="quad-pick">${QUADS.map(q=>`<div class="qp ${q.cls} ${f.quad===q.id?'sel':''}" onclick="setFormQuad(${q.id})"><div class="t">${q.label}</div><div class="s">${q.sub}</div></div>`).join('')}</div>
      <label>דדליין (לא חובה)</label>
      <input type="date" id="f-deadline" value="${f.deadline||''}" />
      <div class="sheet-actions">
        <button class="btn-secondary" onclick="closeSheet()">ביטול</button>
        <button class="btn-primary" onclick="submitForm()">${isEdit?'עדכון':'הוספת משימה'}</button>
      </div>
      ${isEdit?`<div style="margin-top:10px;text-align:center;"><button class="btn-secondary btn-danger" onclick="deleteTask('${view.editingId}');closeSheet();">מחיקת משימה</button></div>`:''}
    </div>
  </div>`;
}

function renderConnectScreen(){
  const err = view.connectError ? `<div class="error-box">${escapeHtml(view.connectError)}</div>` : '';
  const cfg = getConfig();
  return `
  <div class="center-screen">
    <div class="setup-card">
      <div class="eyebrow">חיבור חד-פעמי</div>
      <h1>חיבור למכשיר הזה</h1>
      <p>ב-Firebase Console: Project settings → General → Your apps → אפליקציית Web. משם מעתיקים את כל אובייקט ה-<span class="mono">firebaseConfig</span> ומדביקים כאן במלואו.</p>
      ${err}
      <label>firebaseConfig</label>
      <textarea id="c-cfg" placeholder='{
  apiKey: "...",
  authDomain: "...",
  projectId: "...",
  storageBucket: "...",
  messagingSenderId: "...",
  appId: "..."
}'>${cfg? escapeHtml(JSON.stringify(cfg, null, 2)) : ''}</textarea>
      <div class="sheet-actions">
        <button class="btn-primary" onclick="submitConnect()">התחברות</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  if(!state.loaded){ app.innerHTML=`<div class="center-screen"><span class="spinner"></span></div>`; return; }
  if(view.connectScreen){ app.innerHTML=renderConnectScreen(); return; }
  if(view.screen==='done'){ app.innerHTML = renderDoneScreen(); return; }
  app.innerHTML = `
    <div class="header">
      <div class="header-side">
        <div class="eyebrow">עוזר ניהול משימות · פיקוד</div>
        <h1>סדר עדיפויות יומי</h1>
        ${renderSyncPill()}
      </div>
      <div class="header-actions">
        <button class="icon-round" onclick="showDoneScreen()" aria-label="משימות שבוצעו" title="משימות שבוצעו">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-round" onclick="exportPdf()" aria-label="ייצוא ל-PDF" title="ייצוא ל-PDF">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 15h6M9 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-round" onclick="loadData(false)" aria-label="רענון" title="רענון">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 11-3-6.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-round" onclick="openConnectSettings()" aria-label="הגדרות חיבור" title="הגדרות חיבור">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.56 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.56-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </div>
    ${renderStats()}
    ${renderQuadGrid()}
    <div class="toolbar">
      <div class="toggle">
        <button class="${view.mode==='category'?'active':''}" onclick="setMode('category')">לפי קטגוריה</button>
        <button class="${view.mode==='quadrant'?'active':''}" onclick="setMode('quadrant')">לפי דחיפות</button>
      </div>
      <button class="add-btn" onclick="openAdd()">+ הוספת משימה</button>
    </div>
    <div id="list">${renderList()}</div>
    <div class="footnote">הנתונים נשמרים בפרויקט ה-Firebase הפרטי שלכם, ומסונכרנים אוטומטית בין כל המכשירים שמחוברים אליו.</div>
    ${renderSheet()}
    <div id="print-view"></div>
  `;
  if(view.sheetOpen){ const el=document.getElementById('f-title'); if(el) el.focus(); }
}

function exportPdf(){
  const open = state.tasks.filter(t=>!t.done);
  const labels = ['דחוף וחשוב','חשוב, לא דחוף','דחוף, לא חשוב','לא דחוף ולא חשוב'];
  const qClass = ['q0','q1','q2','q3'];
  const now = new Date();
  const dateStr = now.toLocaleDateString('he-IL', {weekday:'long', year:'numeric', month:'2-digit', day:'2-digit'});
  const timeStr = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
  let html = `<h1>רשימת משימות - הראל ששון</h1><div class="pdate">הופק ב-${escapeHtml(dateStr)}, בשעה ${escapeHtml(timeStr)}</div>`;
  let any = false;
  for(let q=0;q<4;q++){
    const items = sortTasks(open.filter(t=>quadOf(t)===q));
    if(!items.length) continue;
    any = true;
    html += `<h2 class="${qClass[q]}">${labels[q]}</h2><ul>`;
    items.forEach(t=>{
      const dl = t.deadline ? ` — יעד: ${escapeHtml(t.deadline)}` : '';
      html += `<li><span class="box">☐</span><b>${escapeHtml(t.title)}</b> <span class="cat">(${escapeHtml(t.category)})</span>${dl}</li>`;
      (t.subtasks||[]).filter(s=>!s.done).forEach(s=>{
        html += `<li class="sub"><span class="box">☐</span>${escapeHtml(s.title)}</li>`;
      });
    });
    html += `</ul>`;
  }
  if(!any) html += `<p>אין משימות פתוחות כרגע.</p>`;
  const pv = document.getElementById('print-view');
  if(pv) pv.innerHTML = html;
  const appEl = document.getElementById('app');
  if(appEl) appEl.classList.add('printing');
  setTimeout(()=>window.print(), 50);
}

window.addEventListener('afterprint', function(){
  const appEl = document.getElementById('app');
  if(appEl) appEl.classList.remove('printing');
});

function setMode(m){ view.mode=m; render(); }
function showDoneScreen(){ view.screen='done'; render(); }
function showMainScreen(){ view.screen='main'; render(); }
function setActiveQuad(id){ view.activeQuad=(view.activeQuad===id)?null:id; render(); }
function openAdd(){ view.editingId=null; view.form={title:'',category:state.categories[0]||'__new__',newCategory:'',quad:0,deadline:''}; view.sheetOpen=true; render(); }
function openEdit(id){ const t=state.tasks.find(x=>x.id===id); if(!t) return; view.editingId=id; view.form={title:t.title,category:t.category,newCategory:'',quad:quadOf(t),deadline:t.deadline||''}; view.sheetOpen=true; render(); }
function closeSheet(){ view.sheetOpen=false; view.editingId=null; view.form=null; render(); }
function closeSheetIfBackdrop(e){ if(e.target.classList.contains('sheet-backdrop')) closeSheet(); }
function onCatSelectChange(val){ readFormFields(); view.form.category=val; render(); }
function setFormQuad(q){ readFormFields(); view.form.quad=q; render(); }
function toggleExpand(id){ expandedTasks[id]=!expandedTasks[id]; render(); }

function submitNewSubtask(taskId){
  const el=document.getElementById('new-sub-'+taskId);
  if(!el) return;
  const title=el.value.trim();
  if(!title) return;
  addSubtask(taskId, title);
}

async function addSubtask(taskId, title){
  const t=state.tasks.find(x=>x.id===taskId); if(!t) return;
  const subtasks=[...(t.subtasks||[]), {id:uid(), title, done:false}];
  t.subtasks=subtasks; render();
  try{ await patchTaskServer(taskId, {subtasks}); }
  catch(e){ alert('שמירת תת-המשימה נכשלה: '+(e.message||e)); }
}
async function toggleSubtask(taskId, subId){
  const t=state.tasks.find(x=>x.id===taskId); if(!t) return;
  const subtasks=(t.subtasks||[]).map(s=>s.id===subId?{...s,done:!s.done}:s);
  t.subtasks=subtasks; render();
  try{ await patchTaskServer(taskId, {subtasks}); }
  catch(e){ alert('העדכון נכשל: '+(e.message||e)); }
}
async function deleteSubtask(taskId, subId){
  const t=state.tasks.find(x=>x.id===taskId); if(!t) return;
  const subtasks=(t.subtasks||[]).filter(s=>s.id!==subId);
  t.subtasks=subtasks; render();
  try{ await patchTaskServer(taskId, {subtasks}); }
  catch(e){ alert('המחיקה נכשלה: '+(e.message||e)); }
}

function readFormFields(){
  const t=document.getElementById('f-title'), d=document.getElementById('f-deadline'), nc=document.getElementById('f-cat-new');
  view.form.title=t?t.value:view.form.title;
  view.form.deadline=d?d.value:view.form.deadline;
  if(nc) view.form.newCategory=nc.value;
}

async function submitForm(){
  readFormFields();
  const f=view.form;
  const title=(f.title||'').trim();
  if(!title){ const el=document.getElementById('f-title'); if(el) el.style.borderColor='var(--red)'; return; }
  let category=f.category;
  if(category==='__new__'){
    category=(f.newCategory||'').trim();
    if(!category){ const el=document.getElementById('f-cat-new'); if(el) el.style.borderColor='var(--red)'; return; }
    if(!state.categories.includes(category)) state.categories.push(category);
  }
  const urgent=(f.quad===0||f.quad===2);
  const important=(f.quad===0||f.quad===1);
  try{
    if(view.editingId){
      const fields={title,category,urgent,important,deadline:f.deadline||null};
      await patchTaskServer(view.editingId, fields);
      const t=state.tasks.find(x=>x.id===view.editingId);
      if(t) Object.assign(t, fields);
    } else {
      const row={id:uid(),title,category,urgent,important,deadline:f.deadline||null,done:false,subtasks:[]};
      await insertTaskServer(row);
      state.tasks.push(row);
    }
    closeSheet();
  }catch(e){ alert('שמירה נכשלה: ' + (e.message||e)); }
}

async function toggleDone(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const prev=t.done; t.done=!t.done; render();
  try{ await patchTaskServer(id,{done:t.done}); }
  catch(e){ t.done=prev; render(); alert('העדכון נכשל: '+(e.message||e)); }
}
async function deleteTask(id){
  const prevTasks=state.tasks;
  state.tasks=state.tasks.filter(x=>x.id!==id); render();
  try{ await deleteTaskServer(id); }
  catch(e){ state.tasks=prevTasks; render(); alert('המחיקה נכשלה: '+(e.message||e)); }
}

function openConnectSettings(){
  view.connectError=null; view.connectScreen=true; render();
}

async function submitConnect(){
  const raw=document.getElementById('c-cfg').value;
  const cfg=parseFirebaseConfig(raw);
  if(!cfg){ view.connectError='לא הצלחתי לקרוא את הקונפיגורציה. ודאו שהדבקתם את כל האובייקט, כולל הסוגריים המסולסלים, ושהוא כולל לפחות apiKey ו-projectId.'; render(); return; }
  setConfig(cfg);
  db = null;
  view.connectScreen=false;
  state.loaded=false;
  await loadData(false);
  if(state.syncStatus==='error'){ view.connectError=state.syncError; view.connectScreen=true; render(); }
}

Object.assign(window, {toggleDone, deleteTask, openEdit, openAdd, closeSheet, closeSheetIfBackdrop, setMode, setActiveQuad, onCatSelectChange, setFormQuad, submitForm, loadData, openConnectSettings, submitConnect, toggleExpand, submitNewSubtask, toggleSubtask, deleteSubtask, exportPdf, showDoneScreen, showMainScreen});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && getConfig() && !view.connectScreen) loadData(true); });
loadData(false);
</script>
</body>
</html>
